<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Work | Franco Badinas</title>
    <meta name="description" content="Portfolio work by Franco Badinas, showcasing graphic design and short-form video editing." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Playfair+Display:wght@600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="page-shell">
      <header class="site-header">
        <div class="container nav-wrap">
          <a href="index.html" class="brand" aria-label="Franco Badinas home">
            <span class="brand-mark">F</span>
            <span class="brand-text">Franco Badinas</span>
          </a>

          <nav class="main-nav" aria-label="Main navigation">
            <a href="index.html">Home</a>
            <a href="work.html" class="active">Work</a>
            <a href="about.html">About</a>
            <a href="services.html">Services</a>
            <a href="contact.html">Contact</a>
          </nav>

          <div class="nav-actions">
            <button class="theme-toggle" type="button" aria-label="Toggle color theme">
              <span class="theme-dot"></span>
              Theme
            </button>
            <a class="button button-primary" href="contact.html">Book a project</a>
          </div>
        </div>
      </header>

      <main>
        <section class="page-hero compact-hero">
          <div class="container narrow">
            <p class="eyebrow">Portfolio</p>
            <h1>Selected work for brands, creators, and campaigns.</h1>
          </div>
        </section>

        <section class="section">
          <div class="container">
            <div class="filter-row" aria-label="Project filter list">
              <button class="filter-button active" type="button" data-filter="all">All</button>
              <button class="filter-button" type="button" data-filter="branding">Branding</button>
              <button class="filter-button" type="button" data-filter="video">Video</button>
              <button class="filter-button" type="button" data-filter="campaign">Campaign</button>
            </div>

            <div id="portfolio-grid" class="portfolio-grid" aria-live="polite"></div>
          </div>
        </section>
      </main>

      <footer class="site-footer">
        <div class="container footer-wrap">
          <p>© <span id="year"></span> Franco Badinas</p>
          <div class="socials">
            <a href="https://instagram.com" target="_blank" rel="noreferrer">Instagram</a>
            <a href="https://behance.net" target="_blank" rel="noreferrer">Behance</a>
            <a href="https://vimeo.com" target="_blank" rel="noreferrer">Vimeo</a>
          </div>
        </div>
      </footer>
    </div>

    <script src="script.js"></script>
  </body>
</html>
